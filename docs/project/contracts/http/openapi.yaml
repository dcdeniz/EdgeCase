openapi: 3.1.0
info:
  title: PreSeed Edge API
  version: 1.1.0
  description: Hackathon API with a deterministic readiness assessment. ML predictions remain absent pending a promoted model.
x-request-body-limit: 131072
servers:
  - url: https://{project}.supabase.co/functions/v1/api
    variables: { project: { default: project-ref } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, details]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            details: { type: array, items: {} }
    ClinicalTestInput:
      type: object
      additionalProperties: false
      required: [testType, source, collectedAt]
      properties:
        testType: { enum: [semen_analysis, hormone_panel] }
        source: { enum: [manual, upload, simulated] }
        collectedAt: { type: string, format: date-time }
        labName: { type: [string, "null"], maxLength: 200 }
        abstinenceHours: { type: [integer, "null"], minimum: 0, maximum: 720 }
        collectionComplete: { type: [boolean, "null"] }
        recentFever: { type: boolean, default: false }
        notes: { type: [string, "null"], maxLength: 2000 }
    MarkerInput:
      type: object
      additionalProperties: false
      required: [code, value, unit]
      properties:
        code: { type: string }
        value: { type: number }
        unit: { type: string, minLength: 1, maxLength: 40 }
        referenceLow: { type: [number, "null"] }
        referenceHigh: { type: [number, "null"] }
        verification: { enum: [user_entered, user_confirmed, lab_report] }
    ReadinessInputs:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sleep:
          type: object
          additionalProperties: false
          required: [averageHours, regularityMinutes]
          properties:
            averageHours: { type: number, minimum: 0, maximum: 24 }
            regularityMinutes: { type: number, minimum: 0, maximum: 720 }
        substances:
          type: object
          additionalProperties: false
          required: [smokingStatus, alcoholUnitsPerWeek, bingeEpisodes30Days, cannabisDays30]
          properties:
            smokingStatus: { enum: [never, former, current] }
            alcoholUnitsPerWeek: { type: number, minimum: 0, maximum: 300 }
            bingeEpisodes30Days: { type: number, minimum: 0, maximum: 30 }
            cannabisDays30: { type: number, minimum: 0, maximum: 30 }
        diet:
          type: object
          additionalProperties: false
          required: [plantVarietyPerWeek, fruitVegetableServingsPerDay, fishMealsPerWeek, processedMeatMealsPerWeek, sugaryDrinksPerWeek]
          properties:
            plantVarietyPerWeek: { type: number, minimum: 0, maximum: 100 }
            fruitVegetableServingsPerDay: { type: number, minimum: 0, maximum: 30 }
            fishMealsPerWeek: { type: number, minimum: 0, maximum: 21 }
            processedMeatMealsPerWeek: { type: number, minimum: 0, maximum: 21 }
            sugaryDrinksPerWeek: { type: number, minimum: 0, maximum: 70 }
        activity:
          type: object
          additionalProperties: false
          required: [moderateMinutesPerWeek, sedentaryHoursPerDay, extremeTrainingDays30]
          properties:
            moderateMinutesPerWeek: { type: number, minimum: 0, maximum: 2000 }
            sedentaryHoursPerDay: { type: number, minimum: 0, maximum: 24 }
            extremeTrainingDays30: { type: number, minimum: 0, maximum: 30 }
        heat:
          type: object
          additionalProperties: false
          required: [saunaHotTubSessions30Days, occupationalHeatDays30, laptopOnLapHoursPerWeek]
          properties:
            saunaHotTubSessions30Days: { type: number, minimum: 0, maximum: 60 }
            occupationalHeatDays30: { type: number, minimum: 0, maximum: 30 }
            laptopOnLapHoursPerWeek: { type: number, minimum: 0, maximum: 168 }
        reproductiveHealth:
          type: object
          additionalProperties: false
          required: [baselineTestStatus, ejaculationDaysPerWeek, sexualFunctionConcern]
          properties:
            baselineTestStatus: { enum: [none, scheduled, completed] }
            ejaculationDaysPerWeek: { type: number, minimum: 0, maximum: 7 }
            sexualFunctionConcern: { type: boolean }
        environment:
          type: object
          additionalProperties: false
          required: [heatedPlasticMealsPerWeek, plasticDrinkContainersPerDay, occupationalExposureDays30, ppeUsedConsistently]
          properties:
            heatedPlasticMealsPerWeek: { type: number, minimum: 0, maximum: 21 }
            plasticDrinkContainersPerDay: { type: number, minimum: 0, maximum: 20 }
            occupationalExposureDays30: { type: number, minimum: 0, maximum: 30 }
            ppeUsedConsistently: { type: boolean }
        clinicalFlags:
          type: object
          additionalProperties: false
          required: [exogenousTestosterone, anabolicSteroidsOrSarms, chemotherapyOrRadiotherapy, testicularOrObstructionConcern]
          properties:
            exogenousTestosterone: { type: boolean }
            anabolicSteroidsOrSarms: { type: boolean }
            chemotherapyOrRadiotherapy: { type: boolean }
            testicularOrObstructionConcern: { type: boolean }
security: [{ bearerAuth: [] }]
paths:
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200": { description: Account profile }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/onboarding:
    put:
      operationId: putOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fertilityTrack, answers, healthDataConsent]
              properties:
                fertilityTrack: { enum: [general, vasectomy_reversal, pre_treatment_preservation] }
                answers: { type: object }
                healthDataConsent: { type: boolean }
                complete: { type: boolean }
      responses:
        "200": { description: Updated onboarding }
        "422": { description: Invalid onboarding }
  /v1/clinical-tests:
    get:
      operationId: listClinicalTests
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: before, in: query, description: "Opaque collected_at|id cursor returned by the previous page", schema: { type: string } }
      responses:
        "200": { description: Cursor-paginated tests and markers }
    post:
      operationId: createClinicalTest
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClinicalTestInput" } } }
      responses:
        "201": { description: Clinical test created }
        "422": { description: Invalid test }
        "413": { description: Request body exceeds 128 KiB }
  /v1/clinical-tests/{id}:
    get:
      operationId: getClinicalTest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Clinical test and markers }
        "404": { description: Absent or non-owned test }
  /v1/clinical-tests/{id}/markers:
    put:
      operationId: putClinicalMarkers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [markers]
              properties:
                markers: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/MarkerInput" } }
      responses:
        "200": { description: Upserted markers }
        "404": { description: Absent or non-owned test }
        "422": { description: Invalid marker }
  /v1/assessments:
    post:
      operationId: createReadinessAssessment
      description: Creates an append-only deterministic readiness snapshot. The score is behavioural readiness, not fertility or semen quality.
      parameters:
        - { name: idempotency-key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observedAt, inputs]
              properties:
                observedAt: { type: string, format: date-time }
                inputs: { $ref: "#/components/schemas/ReadinessInputs" }
      responses:
        "201": { description: Versioned readiness snapshot with factors, evidence IDs, confidence, clinical gates, and an optional comparable change ledger }
        "200": { description: Existing snapshot returned for a repeated idempotency key }
        "422": { description: Invalid readiness inputs or idempotency key }
  /v1/assessments/latest:
    get:
      operationId: getLatestReadinessAssessment
      responses:
        "200": { description: Latest owned readiness snapshot }
        "404": { description: No readiness assessment }
  /v1/protocols:
    post:
      operationId: createProtocol
      description: Transactionally supersedes the previous active protocol and creates a new immutable version with items.
      responses:
        "201": { description: Active protocol created }
        "422": { description: Invalid protocol }
  /v1/protocols/current:
    get:
      operationId: getCurrentProtocol
      responses:
        "200": { description: Active protocol and items }
        "404": { description: No active protocol }
  /v1/adherence-events:
    post:
      operationId: putAdherenceEvent
      responses:
        "201": { description: Idempotent daily adherence event }
        "422": { description: Invalid event }
  /v1/check-ins:
    post:
      operationId: createCheckIn
      responses:
        "201": { description: Check-in created }
        "422": { description: Invalid check-in }
  /v1/trends:
    get:
      operationId: getTrends
      description: Returns measured tests and collection context without ML interpretation.
      responses:
        "200": { description: Chronological measured results }
