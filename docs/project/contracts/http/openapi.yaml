openapi: 3.1.0
info: { title: EdgeCase API, version: 0.2.0 }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Note:
      type: object
      required: [id, title, body, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NoteInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, default: "" }
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200": { description: Service is available }
  /notes:
    get:
      operationId: listOrGetNotes
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: User-owned note or notes }
        "401": { description: Unauthorized }
    post:
      operationId: createNote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } }
      responses:
        "201": { description: Note created }
        "400": { description: Invalid input }
        "401": { description: Unauthorized }
    patch:
      operationId: updateNote
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Note updated }
        "404": { description: Note not found }
    delete:
      operationId: deleteNote
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Note deleted }
        "404": { description: Note not found }
