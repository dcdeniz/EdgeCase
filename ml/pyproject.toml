[project]
name = "preseed-ml"
version = "0.1.0"
description = "Research-only VISEM progressive-motility baseline for PreSeed"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "imbalanced-learn==0.14.0",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "remotezip==0.12.3",
  "requests==2.32.4",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
]

[dependency-groups]
dev = [
  "jsonschema==4.25.0",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[project.scripts]
preseed-ml = "preseed_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preseed_ml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
